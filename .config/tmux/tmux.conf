# ------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------

set -g @INPUT_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-fpp'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'KakkoiDev/tmux-worktree'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'laktak/tome'
# set -g @plugin 'whame/tmux-modal'

# ------------------------------------------------------------------
# Mouse
# ------------------------------------------------------------------

set -g mouse on

# ------------------------------------------------------------------
# Key bindings
# ------------------------------------------------------------------

# Rebind Prefix to Ctrl-A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------------------------------------------------------------------
# Initialize
# ------------------------------------------------------------------

# Initialize TMUX plugin manager (Keep this at the very bottom of the file)
run '~/.config/tmux/plugins/tpm/tpm'
